
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Positions</title>
</head>
<style>
body {
    height: 3000px;
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f4f4;
}

.close-btn {
    position: absolute;
    top: 20px;
    right: 20px;
    width: 40px;
    height: 40px;
    background: black;
    color: white;
    border-radius: 50%;
    text-align: center;
    line-height: 40px;
    font-weight: bold;
    cursor: pointer;
}

.fixed-box{
    position:fixed;
    bottom: 20px;
    right: 20px;
    width: 320px;
    height: 180px;
    background: rgb(156, 156, 156);
}

.product {
    position: absolute;
    display: inline-block;
    margin: 100px;
    background: white;
    padding: 10px 30px 10px 5px;
    border: 1px solid #cccccc;
}

.product img {
    width: 450px;
    display: block;
}

.discount {
    position: absolute;
    top: 20px;
    right: 30px;
    background: black;
    color: white;
    padding: 6px 10px;
    font-size: 13px;
}

.colorgray {
    position: absolute;
    bottom: 0;
    width: 100%;
    height: 200px;
    background: rgba(255, 255, 255, 0.7);
}

.cart-btn {
    position: absolute;
    bottom: 75px;
    left: 47%;
    transform: translateX(-50%);
    padding: 8px 16px;
    border: 1px solid black;
    background: white;
    cursor: pointer;
}
</style>
<body>

  <div class="close-btn">X</div>

  <div class="product">
    <img src="../../image/shirt.jpg" alt="Shirt" width="450px" height="550px">
    <span class="discount">20% OFF</span>
    <div class="colorgray"></div>
  <div><button class="cart-btn">Add to Cart</button></div>
</div>
  <div class="fixed-box"></div>


</body>
</html>
