<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Positions</title>
    <style>
body {
    height: 3000px;
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f4f4;
}

.close-btn {
    position: absolute;
    top: 20px;
    right: 20px;
    width: 40px;
    height: 40px;
    background:black;
    color: white;
    border-radius: 50%;
    text-align: center;
    line-height: 40px;
    font-weight: bold;
    cursor: pointer;
}

.fixed-box{
    position:fixed;
    bottom: 20px;
    right: 20px;
    width: 320px;
    height: 180px;
    background: rgb(156, 156, 156);
}

.product {
    position: relative;
    display:inline-block;
    margin-top: 10%;
    margin-left: 10%;
    background: white;
    padding: 10px 10px 10px 10px;
    border: 1px solid #cccccc;
}

.product-img{
    height: auto;
    width: 300px;
}

.discount {
    position: absolute;
    top: 20px;
    right: 40px;
    background: black;
    color: white;
    padding: 8px 13px;
    font-size: 14px;
}

.cart-btn {
    position: absolute;
    bottom: 100px;
    left: 50%;
    padding: 10px 25px;
    border: 1px solid black;
    background: white;
    cursor: pointer;
    transform: translateX(-50%);
}

.colorgray {
    position: absolute;
    bottom: 0;
    width: 98.3%;
    height: 180px;
    background: rgba(255, 255, 255, 0.6);
}
    </style>
</head>
<body>

<div class="close-btn">X</div>

<div class="product">
    <img src="/image/shirt.jpg" alt="Shirt" width="450px" height="550px">
    <span class="discount">20% OFF</span>
    <div class="colorgray"></div>
    <button class="cart-btn">Add to Cart</button>
</div>

<div class="fixed-box"></div>

</body>
</html>
