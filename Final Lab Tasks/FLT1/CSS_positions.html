<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
<style>
    body {
        height: 3000px;
         margin: 0;
    }
    .close-btn {
        position: absolute;
        top: 20px;
        right: 20px;
        background: black;
        color: white;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: bold;
        cursor: pointer;
    }
    .fixed-box {
        position: fixed;
        bottom: 20px;
        right: 20px;
        width: 320px;
        height: 180px;
        background-color: gray;
    }
    .product-card {
        position: relative;
        display: inline-block;
    }

    .product-card img {
        width: 250px;
        display: block;
    }

    .badge {
        position: absolute;
        top: 10px;
        right: 10px;
        background: black;
        color: white;
        padding: 5px 8px;
        font-size: 12px;
    }
    .cart-btn {
        position: absolute;
        bottom: 10px;
        left: 50%;
        transform: translateX(-50%);
        padding: 8px 12px;
        border: 1px solid black;
        background: white;
        cursor: pointer;
    }
</style>
</head>
<body>
    <div class="close-btn">X</div>
    <div class="fixed-box"></div>
    <div class="product-card">
            <img src="../../image/shirt.jpg" alt="shirt">
        <div class="badge">20% OFF</div>
    </div>
    <div class="product-card">
        <img src="../../image/shirt.jpg" alt="shirt">
        <div class="badge">20% OFF</div>
        <button class="cart-btn">Add to Cart</button>
    </div>
</body>
</html>
