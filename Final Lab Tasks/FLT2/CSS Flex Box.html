<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Using CSS Flex Box</title>
    <style>
       .flexbox_container{
        display: flex;
        flex-direction: row;
       }
       .flexbox1{
        width: 200px;
        background-color: lightblue;
       }
       .flexbox2{
        width: 75px;
        background-color: lightpink;
       }

       .flexbox_container2{
        display: flex;
        flex-direction: row;
        margin-top: 20px;
       }
       .flexbox3{
        width: 50px;
        background-color: lightblue;
       }
       .flexbox4{
        flex: auto;
        background-color: lightpink;
       }
       .flexbox5{
        width: 75px;
        background-color: lightblue;
       }

        .flexbox_container3{
        display: flex;
        flex-direction: row;
        margin-top: 20px;
        justify-content: space-between;
       }
       .flexbox6{
        width: 45px;
        background-color: lightpink;
       }
       .flexbox7{
        width: 45px;
        background-color: lightpink;
       }
       .flexbox8{
        width: 45px;
        background-color: lightpink;
       }
       .flexbox9{
        width: 45px;
        background-color: lightpink;
       }

        .flexbox_container4{
        display: flex;
        flex-direction: row;
        margin-top: 20px;
        height: 50px;
        justify-content: space-between;
        align-items: center;
        border: 1px solid gray;
       }
       .flexbox10{
        width: 45px;
        background-color: lightpink;
       }
       .flexbox11{
        width: 45px;
        background-color: lightpink;
       }

       header {
        margin-top: 50px;
        height: 150px;
        background-color: antiquewhite;
        border: 1px solid red;
       }
       nav{
        display: flex;
        flex-direction: row;
        height: 300px;
        justify-content: space-between;
        align-items: center;
        border: 1px solid gray;
        background-color: chartreuse;
        border: 1px solid red;
       }
       .nav1{
        width: 30%;
        height: 90%;
        background-color: forestgreen;
        border: 1px solid red;
       }
       .nav2{
        width: 69%;
        height: 90%;
        background-color:forestgreen;
        border: 1px solid red;
       }
       footer {
        height: 150px;
        background-color: antiquewhite;
        border: 1px solid red;
       }
       @media screen and (max-width: 799px) {
        nav {
            flex-direction: column;
        }
        .nav1 {
            margin-bottom: 10px;
            order: 2;
            width: 100%;
            height: 30%;
        }
        .nav2 {
            margin-top: 10px;
            margin-bottom: 10px;
            order: 1;
            width: 100%;
            height: 65%;
        }
        
       }
    </style>
</head>
<body>
    <div class="flexbox_container">
        <div class="flexbox1">200px</div>
        <div class="flexbox2">75px</div>
    </div>

    <div class="flexbox_container2">
        <div class="flexbox3">Item1</div>
        <div class="flexbox4">Item2</div>
        <div class="flexbox5">Item3</div>
    </div>

    <div class="flexbox_container3">
        <div class="flexbox6">Item1</div>
        <div class="flexbox7">Item2</div>
        <div class="flexbox8">Item3</div>
        <div class="flexbox9">Item3</div>
    </div>

    <div class="flexbox_container4">
        <div class="flexbox10">Item1</div>
        <div class="flexbox11">Item2</div>
    </div>
    <header>This is a Header</header>
    <nav>
        <div class="nav1">Section left-nav</div>
        <div class="nav2">Section right-nav</div>
    </nav>
    <footer>This is a Footer</footer>
</body>
</html>
